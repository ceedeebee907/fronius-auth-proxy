name: "Fronius Auth Proxy CB"
description: "HTTP digest authentication proxy for Fronius GEN24 inverters. Allows Home Assistant to control export power limits without handling digest auth."
version: "1.4.0"
slug: "froniusgen24_auth_proxy"
url: "https://github.com/ceedeebee907/fronius-auth-proxy"
authour: "ceedeebee907"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: "Proxy HTTP port"
options:
  fronius_hostname: ""
  fronius_port: 80
  fronius_username: "technician"
  fronius_password: ""
  fronius_https: false
  fronius_reject_unauthorized: false
schema:
  fronius_hostname: str
  fronius_port: int
  fronius_username: str
  fronius_password: str
  fronius_https: bool
  fronius_reject_unauthorized: bool
